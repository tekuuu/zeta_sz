name: Lean verification

on:
  push:
    branches: [main, lean-formalization]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
          nanoda: true
          nanoda-allow-sorry: false
      - name: Print axiom dependencies
        run: lake build ZetaSimpleZeros.Verify --wfail
